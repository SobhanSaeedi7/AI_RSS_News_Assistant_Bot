# Alembic configuration for AI RSS News Assistant

[alembic]
# path to migration scripts
script_location = alembic

# database URL - overridden at runtime from DATABASE_URL environment variable
sqlalchemy.url = postgres+asyncpg://

# version location
version_locations = alembic/versions

# timezone to use when generating revision timestamps
# timezone = UTC

# max length of characters to apply to the version "slug"
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# for autogenerate support
# revision_environment = false

# SQLAlchemy warning filter
# sqlalchemy.warning =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console script
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILE

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
