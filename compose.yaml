# Extension field: one image definition shared by the three long-running
# services and the one-off migration job. Declaring the build once keeps the
# services from drifting apart and gives them a single image tag.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-rss-news-assistant:local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_rss_news}
      POSTGRES_USER: ${POSTGRES_USER:-ai_rss_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Named volume persists PostgreSQL data across container recreations.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_rss_news} -d ${POSTGRES_DB:-ai_rss_news}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bot:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Wait for the agent's liveness check before polling starts, so early
      # /ask requests are not answered with "unavailable".
      agent:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_rss_news}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-ai_rss_news}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      # The bot answers questions over the agent's internal HTTP API. It never
      # calls a provider itself, so no LLM_* settings are needed here.
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:8000}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      # Must stay larger than LLM_TIMEOUT_SECONDS so the agent can report its
      # own provider timeout instead of the bot timing out first.
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-40}
      # /addfeed probes the URL once before storing it; this bounds that fetch
      # so a slow host cannot hang the command.
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-30}
    command: ["bot"]
    restart: unless-stopped

  worker:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_rss_news}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-ai_rss_news}
      # Optional: without a token the worker still ingests news but skips
      # automatic delivery (a warning is logged at startup).
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Optional: without an API key delivery uses extractive summaries.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.avalai.ir/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      # Worker polling and full-text-fetch tuning.
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      FETCH_FULL_TEXT: ${FETCH_FULL_TEXT:-true}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-30}
    command: ["worker"]
    restart: unless-stopped

  # Internal answer service. It is reachable only on the Compose network: no
  # ports are published, so it cannot be called from the host or the internet.
  # Every request must present AGENT_INTERNAL_TOKEN; when the token is unset the
  # API refuses all requests (503) rather than serving unauthenticated traffic.
  # The bot uses the same token value.
  agent:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_rss_news}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-ai_rss_news}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: ${AGENT_PORT:-8000}
      # The agent owns the provider call for answers; without a key it reports
      # that answering is unavailable.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.avalai.ir/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    command: ["agent"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AGENT_PORT:-8000}/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-off migration service. Runs `alembic upgrade head` against the `db`
  # service and exits; it is not restarted automatically. Use:
  #   docker compose up migrate
  # or:
  #   docker compose run --rm migrate
  # It overrides the image entrypoint to `alembic` so the command is passed
  # straight to the Alembic CLI. DATABASE_URL is supplied from Compose
  # environment substitution; credentials are never hard-coded or logged.
  migrate:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_rss_news}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-ai_rss_news}
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"

volumes:
  db_data:
    name: ai_rss_news_db_data
